---
- name: Base Server Configuration
  hosts: devops-vm
  become: yes
  gather_facts: yes
    
  tasks:
  - name: Update apt cache
    apt:
      update_cache: yes
      cache_valid_time: 3600
  - name: Install base packages
    apt:
     name:
        - curl
        - wget
        - git
        - unzip
     state: present
  - name: Install Apache web server
    apt:
     name: apache2
     state: present
  - name: Ensure Apache is running
    service:
     name: apache2
     state: started
     enabled: yes   

                                

